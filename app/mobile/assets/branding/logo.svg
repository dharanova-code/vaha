<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: Warm Paper -->
  <rect width="512" height="512" fill="#FAF8F5"/>

  <!-- Reflective Basin: semicircular arc in Deep Forest Green -->
  <!-- Arc centered at 256,300 with radius 120, opening upward -->
  <path
    d="M 136 300 A 120 120 0 0 1 376 300"
    fill="none"
    stroke="#1B3629"
    stroke-width="18"
    stroke-linecap="round"
  />

  <!-- Vertical stem from arc endpoints going down to base line -->
  <line x1="136" y1="300" x2="136" y2="336" stroke="#1B3629" stroke-width="18" stroke-linecap="round"/>
  <line x1="376" y1="300" x2="376" y2="336" stroke="#1B3629" stroke-width="18" stroke-linecap="round"/>

  <!-- Base line connecting the two stems -->
  <line x1="136" y1="336" x2="376" y2="336" stroke="#1B3629" stroke-width="18" stroke-linecap="round"/>

  <!-- Muted Copper dot: the captured thought, hovering at optical center -->
  <circle cx="256" cy="248" r="22" fill="#C07D53"/>
</svg>
